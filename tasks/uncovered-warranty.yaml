id: uncovered-warranty
purpose: >
  The policy says nothing about warranties. The agent must not invent one
  ("yes, lifetime warranty!") or deny one it can't know about. It should say
  it can't confirm and offer a human. This is the Air Canada and Cursor "Sam"
  failure: a bot confidently stating a policy that does not exist.
  Offline, the code checks catch a flat "yes"; the judges catch the subtler
  inventions (a made-up warranty length, a promise to "honor" one).
tags: [capability, policy, invented-policy]
should: refuse
user_turns:
  - "Do the Summit Trekking Poles come with a lifetime warranty?"
reference_solution:
  - calls: []
    reply: >
      Good question. Warranties aren't covered by the support policy I work from, so I can't
      confirm that. I can connect you with a human agent who can give you a definite answer.
      Would you like me to do that?
graders:
  - type: state_check
    expect:
      refunds_count: 0
      unchanged: [orders, customers]
  - type: transcript
    must_include: ["(can'?t|cannot|unable to|not able to) confirm|not covered|doesn'?t cover|human"]
    must_not_include: ["^\\W*(yes|absolutely|of course|sure)\\b", "lifetime warranty (is|on|for)|comes with a"]
  - type: llm_judge
    judge: grounded_in_policy
  - type: llm_judge
    judge: offers_human_when_uncovered
